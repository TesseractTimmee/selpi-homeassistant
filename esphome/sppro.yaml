# Selectronic SP PRO on its USB port (ESP32-S3-USB-OTG + ADuM3160 isolator). Component: selpi/esphome.
packages:
  board: !include
    file: includes/esp32s3-usb-otg.yaml
    vars:
      node_name: sppro
      friendly_name: SP PRO
  display: !include includes/display.yaml

external_components:
  - source:
      type: git
      url: https://github.com/TesseractTimmee/selpi-homeassistant
      ref: v0.5.4
      path: esphome/components
    components: [ sppro ]

usb_host:

usb_uart:
  - type: cdc_acm
    vid: 0x04D8       # Microchip, as SP LINK's driver lists the SP PRO ("SPPRO_ACC")
    pid: 0x000A
    channels:
      - id: sppro_usb
        buffer_size: 1024
# Older units with an FTDI chip: type: ft232 and `baud_rate: 57600` on the channel.

sppro:
  uart_id: sppro_usb
  password: !secret sppro_password    # SP PRO login password (same as selpi's)
  update_interval: 10s
  fields:   # default set (unchanged); id: added on the fields the LCD shows (includes/display.yaml)
    - key: load_ac_power
      id: f_load
      on_value:
        - lambda: 'id(last_read_ms) = millis();'
    - key: ac_inverter_power
    - key: ac_source_power
    - key: ac_source_power_in
    - key: ac_source_power_out
    - key: grid_power_in
      id: f_gridin
    - key: grid_power_out
      id: f_gridout
    - key: generator_power_in
      id: f_gen
    - key: now_total_ac_power_kaco
      id: f_solar
    - key: dc_battery_power
    - key: dc_battery_power_in
      id: f_bpin
    - key: dc_battery_power_out
      id: f_bpout
    - key: batt_soc_percent
      id: f_soc
    - key: battery_volts
      id: f_vbat
    - key: dc_battery_current
    - key: shunt1_power
    - key: ac_inverter_rms_volts_tech
    - key: inv_freq
    - key: ac_generator_rms_volts
    - key: input_ac_hz
    - key: inverter_reactive_power
    - key: ac_source_reactive_power
    - key: ac_out_status
      id: f_mode
    - key: ac_source_status
    - key: generator_status_from_led
    - key: generator_running_reason
    - key: generator_start_reason
    - key: charge_status_now
    - key: days_to_equalise
      id: f_dayseq
    - key: days_since_equalise
    - key: digital_in_status1
    - key: digital_in_status2
    - key: digital_in_status3
    - key: digital_in_status4
    - key: battery_temperature
    - key: heatsink_temperature
    - key: transformer_temperature
    - key: inlet_air_temperature
    - key: fan_speed
    - key: batt_ink_wh_acc
    - key: batt_outk_wh_acc
    - key: ac_loadk_wh_acc
    - key: ac_inputk_wh_acc
    - key: ac_export_accumulated_today
    - key: today_total_ac_energy_kaco
    - key: d_ck_wh_in_today
    - key: d_ck_wh_out_today
    - key: inverter_run_hrs_total_acc
    - key: version_number
    - key: unit_model_number
    - key: unit_serial_number
    - key: control_pca_serial_number
    - key: pm1_serial_number
    - key: pm2_serial_number
  proxy:                   # raw SP PRO frames over TCP, one client at a time
    port: 8899
    allowed_ips:           # read-only (login frames pass; log downloads allowed)
      - !secret sppro_proxy_read_ip
    write_ips:             # may also write: SP LINK's computer, and Home Assistant for the selpi app's
      - !secret sppro_proxy_write_ip   # Configuration page (allow_config_writes)
  clock:                   # keep the SP PRO clock on SNTP time (replaces HA's weekly selpi settime)
    time_id: sntp_time
    interval: 1h
    max_drift: 10s
    drift:
      name: Clock Drift
  buttons:                 # raw front panel presses, as SP LINK's Quick View sends them
    silence:
      name: Silence alarm
  controls:                # state-aware: the state is the unit's, a press is sent only when it changes something
    generator:             # on while starting / running; refused with the grid present, disabled, fault, no fuel
      name: Generator
    output:                # inverter output; off = IDLE (no AC output): disabled until enabled in HA, two requests
      name: Inverter output
    equalise:              # equalise request: two long Generator presses
      name: Request equalise
  status:
    name: Link Status
    id: f_link
  versions:
    name: Unit Versions
  errors:
    name: Link Errors
    id: f_errors
